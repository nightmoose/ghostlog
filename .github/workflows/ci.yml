name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (offline, no Ollama needed)
        run: pytest -v
      - name: Smoke test the CLI without a model
        run: |
          ghostlog summon examples/legacy/nightly_orders_etl.log --out /tmp/tombstone.html
          grep -q "R.I.P." /tmp/tombstone.html
